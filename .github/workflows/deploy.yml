name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from the GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; a new push cancels any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Map data is generated here rather than committed. Raw downloads (LIDAR
      # tiles, OSM extract) are cached, so deploys don't re-download them unless
      # the area or the fetch scripts change.
      - name: Cache raw source data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('data/area.py', 'data/fetch_*.py') }}

      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin

      - uses: astral-sh/setup-uv@v6

      - name: Build map data
        run: data/build.sh

      - name: Export the 3D engine's level
        run: uv run export_engine.py
        working-directory: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build site
        run: npm run build
        working-directory: web

      # v1, the 3D engine, built to WebAssembly here (never committed) and served under /3d/.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin trunk

      # Two builds (WebGPU and WebGL2) and a loader page that picks one.
      - name: Build 3D engine (WebAssembly)
        run: ./build-web.sh /heathmap/3d/
        working-directory: engine

      - name: Add the 3D engine to the site
        run: cp -r engine/dist web/dist/3d

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
