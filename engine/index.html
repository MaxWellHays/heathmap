<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>heathmap 3D</title>
  <!-- Web build of the engine (trunk build, see engine/README.md). -->
  <link data-trunk rel="rust" data-cargo-profile="web" data-wasm-opt="s">
  <link data-trunk rel="copy-dir" href="assets">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c7d9eb; }
    #heathmap { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px system-ui, sans-serif; color: #2f6b2f; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="heathmap" tabindex="0"></canvas>
  <div id="loading">Loading heathmap…</div>
  <script>
    // trunk fires this once the wasm module has started; the engine shows its own progress after that.
    addEventListener("TrunkApplicationStarted", () => document.getElementById("loading").remove());
  </script>
</body>
</html>
