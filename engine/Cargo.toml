[package]
name = "heathmap-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["png"] }
bevy_egui = "0.42.0"
csv = "1.4.0"
earcutr = "0.5.0"
fitparser = "0.11.0"
flate2 = "1.1.10"
quick-xml = "0.41"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_brp_extras = "0.22.8"
dirs = "7.0.0"
rfd = "0.17.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Event", "EventTarget", "DragEvent", "DataTransfer", "File", "FileList", "Blob", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbRequest", "CssStyleDeclaration", "console"] }

# Bevy is slow in debug builds; optimise dependencies even in dev, keep our crate quick to compile.
# Debug info is trimmed to keep the binary and the link step small: full debug info gave a
# ~2 GB binary whose link can exhaust the memory of a 16 GB machine.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Web build (trunk, see index.html): optimised for size (the download), stripped of symbol
# names (58 MB of them), without LTO and with parallel codegen so it compiles in reasonable
# time and memory.
[profile.web]
inherits = "release"
opt-level = "s"
lto = false
codegen-units = 16
debug = false
strip = true
